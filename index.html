<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Simulador de vida · Tutoría 3° año</title>
<meta name="description" content="Simulador de decisiones para Tutoría de 3° año: de los 15 a los 22 años.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102f48'/%3E%3Cpath d='M14 44c8-20 28-20 36 0' fill='none' stroke='%23f3c66d' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='7' fill='%23f3c66d'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#102f48;--gold:#f3c66d;--teal:#145b78;--teal-d:#0d465f;--ink:#153146;--muted:#4c697b;
  --bg:#f2f6f8;--card:#fff;--line:#d9e4e9;--soft:#e9f2f6;
  --c-plata:#c98a12;--c-bienestar:#2f8f5b;--c-vinculos:#8a4fc0;--c-formacion:#2a6fb0;
  --good:#167153;--bad:#b4402d;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
header{background:var(--navy);color:#fff;padding:.9rem max(1rem,calc((100vw - 860px)/2));display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
header strong{font-size:1.1rem}
header span{color:#cddfe8;font-size:.92rem}
header .hbtn{margin-left:auto;background:transparent;color:#fff;border:1px solid #5d7d93;border-radius:8px;padding:.5rem .75rem;font-size:.9rem}
header .hbtn:hover{background:#1c4462}
main{max-width:860px;margin:0 auto;padding:1.2rem 1rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(1.1rem,3.5vw,2rem);box-shadow:0 8px 30px rgba(20,55,75,.06)}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#276582;margin:0 0 .5rem}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.15;margin:0 0 .8rem}
h2{font-size:1.1rem;margin:1.5rem 0 .6rem}
p{line-height:1.55}
.lead{font-size:1.06rem;color:#2b4a5e}
.big-emoji{font-size:2.6rem;line-height:1;margin-bottom:.5rem}
.note{background:var(--soft);border-radius:10px;padding:.85rem 1rem;line-height:1.5;color:#37556a;margin:1rem 0}
.care{background:#fff6e3;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:.75rem 1rem;font-size:.93rem;color:#5b4a1f;margin:1rem 0}
.echo{display:flex;gap:.6rem;align-items:flex-start;background:#eef0fb;border:1px solid #c9cdf0;border-radius:10px;padding:.75rem 1rem;margin:1rem 0;line-height:1.5}
.echo b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#4a4fa0}
.field{display:grid;gap:.4rem;margin:1rem 0;font-weight:650}
.field input,.field textarea{border:1.5px solid #a8bdc9;border-radius:9px;padding:.7rem;color:var(--ink);background:#fcfeff;font-weight:400}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #afdce9;outline-offset:2px}
.row{display:flex;gap:1rem;flex-wrap:wrap}.row>.field{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.6rem;margin:.6rem 0 1rem}
.pick{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.8rem;text-align:left;color:var(--ink);line-height:1.3;transition:.15s}
.pick:hover{border-color:#75a8b9;background:#f6fbfd}
.pick[aria-pressed="true"]{border-color:var(--teal);background:#dbeef4;box-shadow:inset 0 0 0 1px var(--teal)}
.pick .e{font-size:1.5rem;display:block;margin-bottom:.3rem}
.pick small{display:block;color:var(--muted);margin-top:.2rem}
.options{display:grid;gap:.65rem;margin-top:1.2rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;background:#fff;border:1.5px solid #b8cbd6;border-radius:12px;padding:.9rem 1rem;text-align:left;color:var(--ink);line-height:1.45;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f3f9fb;transform:translateY(-1px)}
.opt .l{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt:disabled{opacity:.55;background:#f4f6f7}
.opt .lock{display:block;font-size:.85rem;color:var(--bad);margin-top:.25rem}
.chosen{border:2px solid var(--teal);background:#f0f8fb;border-radius:12px;padding:.9rem 1rem;margin-top:1.2rem}
.chosen .tag{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.result{margin-top:1rem;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0}
.chip{border-radius:999px;padding:.3rem .7rem;font-size:.88rem;font-weight:700}
.chip.up{background:#dcf2e6;color:var(--good)}.chip.down{background:#fbe3de;color:var(--bad)}.chip.zero{background:#eef2f4;color:var(--muted)}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.5rem}
.primary,.secondary,.danger{border-radius:10px;padding:.8rem 1.1rem;font-weight:750}
.primary{background:var(--teal);color:#fff;border:1px solid var(--teal)}
.primary:hover:not(:disabled){background:var(--teal-d)}
.primary:disabled{background:#9db5c1;border-color:#9db5c1}
.secondary{background:#fff;color:var(--teal);border:1px solid #85aab9}
.secondary:hover{background:#eef6f9}
.danger{background:#fff;color:var(--bad);border:1px solid #e0a89c;font-size:.9rem;padding:.6rem .9rem}
.status{min-height:1.4rem;color:#315b6e;margin:.6rem 0 0;font-size:.93rem}
.hud{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem}
.hud-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:baseline;margin-bottom:.6rem}
.hud-top b{font-size:1rem}.hud-top span{color:var(--muted);font-size:.9rem}
.timeline{display:flex;gap:4px;margin-bottom:.7rem}
.timeline i{flex:1;height:6px;border-radius:3px;background:#dde7ec}
.timeline i.on{background:var(--gold)}.timeline i.now{background:var(--teal)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem 1rem}
.bar{font-size:.85rem}
.bar .top{display:flex;justify-content:space-between;margin-bottom:.2rem}
.bar .track{height:9px;background:#e6edf1;border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;transition:width .6s ease}
.counter{font-size:.85rem;color:var(--muted);text-align:right}
.counter.ok{color:var(--good)}
.moments{padding-left:1.2rem;line-height:1.6}
.ending{text-align:center;padding:1rem 0 .5rem}
.ending .big-emoji{font-size:3.4rem}
.lives{display:grid;gap:.5rem;margin:.6rem 0}
.life{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:.6rem .9rem;font-size:.93rem}
.small{font-size:.88rem;color:var(--muted)}
@media(max-width:520px){.bars{grid-template-columns:1fr}.opt{padding:.8rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <strong>Simulador de vida</strong><span>Tutoría · 3° año</span>
  <button class="hbtn" id="homeBtn" type="button">☰ Inicio</button>
</header>
<main id="app" aria-live="polite"></main>

<script>
/* =========================================================
   SIMULADOR DE VIDA — Tutoría 3° año
   Todo queda en el navegador (localStorage). No envía datos.
   ========================================================= */
const KEY = 'simvida-tutoria-2026-v1';
const MIN_REFLECT = 40; // caracteres mínimos en cada reflexión

const STATS = {
  plata:     {label:'Ahorros',   icon:'💰', color:'var(--c-plata)'},
  bienestar: {label:'Bienestar', icon:'🌱', color:'var(--c-bienestar)'},
  vinculos:  {label:'Vínculos',  icon:'🤝', color:'var(--c-vinculos)'},
  formacion: {label:'Formación', icon:'📚', color:'var(--c-formacion)'}
};

const INTERESTS = {
  tecno:   {label:'Tecnología y compus',     e:'💻', venta:'arreglar celulares y configurar compus de vecinos', curso:'un curso de programación', area:'la tecnología'},
  energia: {label:'Naturaleza y energía',    e:'☀️', venta:'armar y vender cargadores solares chiquitos', curso:'un curso de instalador/a de paneles solares', area:'las energías renovables'},
  arte:    {label:'Arte, música o diseño',   e:'🎨', venta:'diseñar stickers y logos por encargo', curso:'un curso de diseño gráfico', area:'el diseño y el arte'},
  deporte: {label:'Deportes',                e:'⚽', venta:'ayudar a entrenar a chicos más chicos en el club', curso:'un curso de auxiliar de entrenamiento deportivo', area:'el deporte'},
  cocina:  {label:'Cocina',                  e:'🍳', venta:'vender budines y alfajores', curso:'un curso de cocina profesional', area:'la gastronomía'},
  manos:   {label:'Arreglar y construir',    e:'🔧', venta:'hacer arreglos chicos en casas del barrio', curso:'un curso de electricidad domiciliaria', area:'los oficios'}
};

const STRENGTHS = {
  constancia:{label:'Constancia',       desc:'Seguís aunque cueste',                  stat:'formacion'},
  trato:     {label:'Buen trato',       desc:'La gente se siente cómoda con vos',     stat:'vinculos'},
  calma:     {label:'Calma',            desc:'No te desbordás fácil',                 stat:'bienestar'},
  orden:     {label:'Orden con la plata', desc:'Sabés en qué se te va cada peso',     stat:'plata'}
};

const GENDERS = {m:'Chico', f:'Chica', n:'Prefiero neutro'};
const o = g => ({m:'o', f:'a', n:'e'})[g.g] || 'e';
const has = (g, f) => g.flags.includes(f);
const val = (x, g) => typeof x === 'function' ? x(g) : x;
const intr = g => INTERESTS[g.interest];

/* ---------------- ETAPAS ---------------- */
const STAGES = [
  {name:'3° año', age:15, e:'🎒',
   intro:'Arrancás 3° año. Nuevas materias, el grupo de WhatsApp del curso que no para y la sensación de que todo pasa muy rápido.',
   scenes:['consigna','foto','prueba','cumple'], pool:['amigo','nota'],
   reflect:'¿Qué decisión de esta etapa te costó más elegir? ¿Por qué? (Contestá pensando en tu personaje.)'},
  {name:'5° año', age:17, e:'🎓',
   intro:'Último tramo del secundario. Aparecen las primeras changas, la pregunta de «qué vas a hacer después» y decisiones con plata de verdad.',
   scenes:['futuro','laburo','estafa','amistad'], pool:['celu','solar'],
   reflect:'Elegí una decisión que tu personaje tomó en 3° año y explicá cómo influyó (o pudo haber influido) en lo que le pasó en esta etapa.'},
  {name:'Después del secundario', age:19, e:'🧭',
   intro:'Terminaste la escuela. Ahora nadie te dice qué hacer cada día: las decisiones son más tuyas que nunca.',
   scenes:['camino','entrevista','sueldo','cansancio'], pool:['familia','ia'],
   reflect:'Mirá los indicadores de tu personaje. ¿Cuál descuidó más? ¿Qué decisión concreta cambiarías para mejorarlo?'},
  {name:'22 años', age:22, e:'🌅',
   intro:'Pasaron siete años desde aquel 3° año. Queda una decisión grande y una pregunta que te van a hacer a vos.',
   scenes:['emprender'], pool:[],
   reflect:'Tu primo/a de 15 años está en 3° año y te pregunta: «¿Qué es lo que te hubiera gustado saber a mi edad?». ¿Qué le contestás? Usá lo que vivió tu personaje.'}
];

/* ---------------- ESCENAS ----------------
   fx: cambios en indicadores (objeto o función)
   set: marcas que pueden tener consecuencias más adelante
   fb: qué pasó después (texto o función)
   memo: frase que aparece en el resumen final
   need/lock: opción bloqueada si no se cumple una condición
------------------------------------------- */
const SCENES = {
  /* ===== 3° AÑO ===== */
  consigna:{e:'❓', title:'La consigna que nadie entendió',
    text:'Es lunes. La profe de Física explica un trabajo práctico y todos asienten. Vos no entendiste qué hay que entregar. Tenés la mano medio levantada… y el de atrás ya está haciendo chistes.',
    options:[
      {t:'Me acerco a la profe al final de la clase y le pregunto en privado.', fx:{formacion:8,bienestar:3}, set:['pregunta'], memo:'Preguntó cuando no entendía algo',
       fb:'La profe te lo explica en dos minutos. Después te enterás de que otros tres tampoco habían entendido, pero solo vos preguntaste. Preguntar en privado es una buena salida cuando el grupo intimida.'},
      {t:'Le pregunto a Ale, que suele entender todo.', fx:{formacion:5,vinculos:5}, set:['pregunta'], memo:'Se apoyó en un compañero para entender',
       fb:'Ale te explica con un ejemplo y terminan haciendo el trabajo juntos. Funciona… aunque si Ale también hubiera entendido mal, se equivocaban los dos. Lo ideal es chequear con quien dio la consigna.'},
      {t:'No pregunto. Lo hago como me parece.', fx:{formacion:-6,bienestar:-3},
       fb:'Entregás algo que no era lo que pedían. No es grave, pero trabajaste el doble y la nota no muestra lo que sabés. Una pregunta a tiempo te ahorraba todo eso.'}
    ]},
  foto:{e:'📱', title:'La foto en el grupo',
    text:'En el grupo de WhatsApp del curso aparece una foto de Tomi dormido en el colectivo, editada con un filtro ridículo. Ya tiene catorce reacciones de risa. Tomi está en el grupo, pero no dijo nada.',
    options:[
      {t:'Me río y la reenvío a otro grupo. Es una joda.', fx:{vinculos:-6}, set:['foto'], memo:'Reenvió una foto que burlaba a un compañero',
       fb:'En el momento parece inofensivo. Pero esa foto ya no es de nadie: salió del grupo y no sabés dónde termina. Y lo que mandás queda asociado a tu nombre, aunque lo borres después.'},
      {t:'No reacciono y sigo con lo mío.', fx:{bienestar:-2},
       fb:'No sumaste a la burla, y eso cuenta. Pero Tomi no sabe si a alguien le pareció mal. Cuando nadie dice nada, el silencio de todos se lee como que está bien.'},
      {t:'Escribo «Che, bórrenla, no da» y le mando un mensaje privado a Tomi.', fx:{vinculos:8,bienestar:-2}, set:['defendio'], memo:'Frenó una burla en el grupo del curso',
       fb:'Dos compañeros te apoyan y la foto se borra. Alguien te dice «amargo». Tomi te contesta solo «gracias». Poner un límite tuvo un costo chico y un efecto grande.'},
      {t:'Le aviso a un adulto de la escuela (preceptor/a o tutor/a).', fx:{vinculos:4,bienestar:3}, set:['defendio'], memo:'Pidió ayuda a un adulto ante una burla',
       fb:'El preceptor habla con el curso sin nombrar a nadie y la foto desaparece. Avisar a un adulto no es «buchonear»: es pedir ayuda cuando algo se pasa de la raya.'}
    ]},
  prueba:{e:'📵', title:'La noche antes de la prueba',
    text:'Mañana hay prueba de Matemática. Son las 19 h, tenés el celular al lado y no para de vibrar: el grupo, un juego, videos.',
    options:[
      {t:'Activo «No molestar», estudio 40 minutos y después me tomo un recreo con el celu.', fx:{formacion:10,bienestar:2}, memo:'Organizó el estudio sacando distracciones',
       fb:'Rinde mucho más de lo que esperabas. Y el recreo con el celular lo disfrutás sin culpa. No se trata de tirar el celular: se trata de que no te maneje él a vos.'},
      {t:'Estudio con el celular al lado y contesto cuando suena.', fx:{formacion:3,bienestar:-3},
       fb:'Estuviste tres horas «estudiando», pero rindieron como una. Cada interrupción te saca del tema y volver a concentrarte cuesta varios minutos.'},
      {t:'Hoy no da. Veo videos y mañana leo en el colectivo.', fx:{formacion:-8,bienestar:4},
       fb:'Esa noche la pasaste bien. A la mañana, nervios y la sensación de que no sabías nada. Descansar a veces está bien, pero conviene que sea una decisión y no algo que simplemente pasa.'}
    ]},
  cumple:{e:'🎁', title:'Plata de cumpleaños',
    text:'Cumplís 16 y entre la familia te juntaron $40.000 (los valores del juego son inventados). Hace rato que querés unas zapatillas que cuestan justo eso.',
    options:[
      {t:'Me compro las zapatillas. Me las merezco.', fx:{bienestar:8,plata:-5},
       fb:'Las disfrutás un montón. Darse gustos también es parte de manejar la plata. Solo que, si surge un imprevisto, no tenés nada guardado.'},
      {t:'Guardo la mitad y con el resto me compro algo más barato.', fx:{plata:10,bienestar:3}, set:['ahorro'], memo:'Empezó a ahorrar desde los 16',
       fb:'No son las zapatillas soñadas, pero tenés algo guardado por primera vez. Ahorrar no es no gastar: es decidir qué parte gastás.'},
      {t:g=>`Uso la plata para arrancar un mini emprendimiento: ${intr(g).venta}.`, fx:{plata:6,formacion:5,bienestar:-2}, set:['emprendimiento'], memo:'Arrancó un emprendimiento a los 16',
       fb:'Los primeros pedidos son de la familia. Te equivocás con los precios (cobrabas menos de lo que te costaba hacerlo), pero aprendés a calcular. Emprender es probar, equivocarse y corregir.'}
    ]},
  amigo:{e:'💬', title:'Un mensaje de Juli', care:true,
    text:'Juli, tu amistad desde la primaria, anda distinto: no viene a las salidas, dice que duerme mal y te escribió «no tengo ganas de nada». Te pide que no le cuentes a nadie.',
    options:[
      {t:'Escucho a Juli, le digo que me importa y le propongo ir juntos a hablar con un adulto de confianza.', fx:{vinculos:8,bienestar:-2}, set:['ayudo'], memo:'Acompañó a una amistad a pedir ayuda',
       fb:'Al principio Juli se enoja un poco. Después acepta hablar con la tutora y vas con Juli. Guardar un secreto no vale cuando alguien la está pasando mal: buscar ayuda no es traicionar.'},
      {t:'Le digo «ya se te va a pasar, no te bajonees».', fx:{vinculos:-3},
       fb:'Lo decís con buena intención, pero Juli siente que no le prestaste atención. Cuando alguien está mal, escuchar sirve más que dar soluciones rápidas. Y si la cosa sigue, hace falta un adulto.'},
      {t:'Lo cuento en el grupo de amigos para que entre todos le levanten el ánimo.', fx:{vinculos:-10},
       fb:'A Juli le duele que lo hayas contado delante de todos. Pedir ayuda está bien, pero contarlo en un grupo no: lo privado se cuida, y la ayuda se busca con un adulto.'}
    ]},
  nota:{e:'📉', title:'Un 3 que no esperabas',
    text:'Te sacás un 3 en la prueba de Historia. Y lo peor: habías estudiado.',
    options:[
      {t:'Le pido a la profe que me muestre en qué me equivoqué.', fx:{formacion:8}, memo:'Usó un error para aprender',
       fb:'Descubrís que estudiaste de memoria y la prueba pedía relacionar. Ya sabés qué cambiar para el recuperatorio.'},
      {t:'Me convenzo de que «no sirvo para Historia».', fx:{formacion:-5,bienestar:-5},
       fb:'Una nota habla de una prueba, no de lo que sos. Decir «no sirvo para esto» corta el camino antes de saber qué falló.'},
      {t:'Lo hablo en casa y armo un plan para el recuperatorio.', fx:{formacion:5,bienestar:3,vinculos:3},
       fb:'Contarlo te saca un peso de encima y alguien en casa te ayuda a organizar los temas. Aprobás el recuperatorio.'}
    ]},

  /* ===== 5° AÑO ===== */
  futuro:{e:'🧭', title:'¿Y después qué?',
    text:g=>`Falta un año para terminar. Todos hablan de «qué vas a hacer después». A vos te tira ${intr(g).area}, pero no sabés bien qué opciones hay.`,
    options:[
      {t:g=>`Voy a una expo de carreras y le pregunto a alguien que trabaja en ${intr(g).area} cómo es su día a día.`, fx:{formacion:8,bienestar:2}, set:['investigo'], memo:'Investigó opciones antes de decidir',
       fb:'Te enterás de cosas que no estaban en ningún video: horarios, sueldos reales, qué es lo aburrido del trabajo. Ahora tenés información para decidir, no solo ganas.'},
      {t:'Elijo lo mismo que mis amigos, así no arranco sin nadie.', fx:{vinculos:5}, set:['amigos'],
       fb:'Te da tranquilidad arrancar con gente conocida. El tema es que tus amigos eligieron pensando en ellos, no en vos.'},
      {t:'No lo pienso todavía. Ya veré cuando termine.', fx:{bienestar:4}, set:['sinplan'],
       fb:'Te sacás presión de encima por ahora. Pero la decisión no desaparece: solo se mueve para más adelante, y con menos tiempo para pensarla.'}
    ]},
  laburo:{e:'🛒', title:'Una changa los sábados',
    text:'El dueño del almacén del barrio te ofrece trabajar los sábados. Dice que paga «bien», pero no aclara cuánto ni cuántas horas.',
    options:[
      {t:'Acepto ya, no quiero perder la oportunidad.', fx:{plata:10,formacion:-4,bienestar:-3}, set:['informal'],
       fb:'Te hace quedar nueve horas y te paga menos de lo charlado. Sin nada acordado, es difícil reclamar. A los 17 la ley permite trabajar, pero con límites de horario y con autorización de tus adultos responsables.'},
      {t:'Le pregunto horario y pago, y lo hablo en casa antes de aceptar.', fx:{plata:8,formacion:2}, set:['laburo'], memo:'Preguntó condiciones antes de aceptar un trabajo',
       fb:'Acuerdan cuatro horas y un pago fijo. Preguntar no te hace quedar mal: te hace quedar como alguien serio. Y el almacenero se acuerda de eso.'},
      {t:'No acepto. Este año quiero terminar bien la escuela.', fx:{formacion:6,plata:-2},
       fb:'Te enfocás en terminar y te va mejor. Tenés menos plata para salir, pero ganaste tiempo. Toda decisión deja algo afuera.'}
    ]},
  estafa:{e:'🚨', title:'La app que multiplica la plata',

  equilibrio:{t:'En equilibrio', e:'⚖️', d:'Tu personaje logró sostener varias partes de su vida al mismo tiempo. No es perfecto: es parejo.'}

const WEAK = {
  plata:'Sin ahorros, cada imprevisto se vuelve un problema grande.',
  bienestar:'El cansancio y el estrés se fueron acumulando.',
  vinculos:'Se fue quedando con menos gente cerca.',
  formacion:'Tiene menos opciones de las que podría haber tenido.'
};
function computeEnding(g){
  const s = g.stats, keys = Object.keys(s);
  const sorted = keys.slice().sort((a,b)=>s[b]-s[a]);
  const min = keys.reduce((a,b)=>s[a]<=s[b]?a:b);
  const key = keys.every(k=>s[k]>=55) ? 'equilibrio' : sorted[0];
  const weak = s[min] < 40 ? `Lo que quedó flojo: ${STATS[min].label.toLowerCase()}. ${WEAK[min]}` : '';
  return {key, title:ENDINGS[key].t, emoji:ENDINGS[key].e, text:ENDINGS[key].d, weak};
}

/* ---------------- ALMACENAMIENTO ---------------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(){ return {v:1, student:'', curso:'', lives:[], game:null, setup:null}; }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.v===1) return d; }catch(e){} return blank(); }
let DB = load();
let saveOk = true;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); saveOk = true; }catch(e){ saveOk = false; } }

/* ---------------- UTILIDADES DE JUEGO ---------------- */
const clamp = n => Math.max(0, Math.min(100, n));
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
function stageOfStep(g, idx){ let st=0; for(let i=0;i<=idx;i++){ if(g.steps[i].k==='stage') st=g.steps[i].i; } return st; }

function newGame(setup){
  const stats = {plata:50, bienestar:50, vinculos:50, formacion:50};
  stats[STRENGTHS[setup.strength].stat] += 10;
  const steps = [];
  STAGES.forEach((st,i)=>{
    steps.push({k:'stage', i});
    const sc = st.scenes.slice();
    if(st.pool.length){ const ev = shuffle(st.pool)[0]; const pos = 1 + Math.floor(Math.random()*sc.length); sc.splice(pos,0,ev); }
    sc.forEach(id=>steps.push({k:'scene', id}));
    steps.push({k:'reflect', i});
  });
  steps.push({k:'end'});
  DB.game = {...setup, stats, flags:[], log:[], reflections:[], steps, pos:0, picked:null, draft:'', started:new Date().toISOString(), lifeIndex:null};
  DB.setup = null;
  persist();
}

function choose(idx){
  const g = DB.game, step = g.steps[g.pos], sc = SCENES[step.id], op = sc.options[idx];
  if(g.picked) return;
  if(op.need && !op.need(g)) return;
  const fx = val(op.fx, g) || {};
  const fb = val(op.fb, g);
  const deltas = {};
  Object.keys(fx).forEach(k=>{ const before=g.stats[k]; g.stats[k]=clamp(before+fx[k]); deltas[k]=g.stats[k]-before; });
  (op.set||[]).forEach(f=>{ if(!g.flags.includes(f)) g.flags.push(f); });
  const st = STAGES[stageOfStep(g, g.pos)];
  g.log.push({stage:`${st.name} · ${st.age} años`, title:sc.title, situation:val(sc.text,g), echo:sc.echo?val(sc.echo,g):null, choice:val(op.t,g), fb, deltas, memo:op.memo||null});
  g.picked = {idx, fb, deltas};
  persist();
  render();
}

function next(){ const g=DB.game; g.picked=null; g.draft=''; g.pos++; persist(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------------- RENDER ---------------- */
function hud(g){
  const stIdx = stageOfStep(g, g.pos), st = STAGES[stIdx];
  const total = g.steps.length-1, done = Math.min(g.pos, total);
  const tl = g.steps.slice(0,-1).map((s,i)=>`<i class="${i<g.pos?'on':i===g.pos?'now':''}"></i>`).join('');
  return `<div class="hud">
    <div class="hud-top"><b>${esc(g.char)} · ${st.age} años</b><span>${st.e} ${esc(st.name)} · paso ${done+1} de ${total}</span></div>
    <div class="timeline" aria-hidden="true">${tl}</div>
    <div class="bars">${barsHTML(g.stats)}</div>
  </div>`;
}
function barsHTML(stats){
  return Object.keys(STATS).map(k=>`<div class="bar"><div class="top"><span>${STATS[k].icon} ${STATS[k].label}</span><b>${stats[k]}</b></div>
    <div class="track" role="progressbar" aria-label="${STATS[k].label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${stats[k]}"><div class="fill" style="width:${stats[k]}%;background:${STATS[k].color}"></div></div></div>`).join('');
}
function chipsHTML(deltas){
  const keys = Object.keys(deltas);
  if(!keys.length) return '<span class="chip zero">Sin cambios</span>';
  return keys.map(k=>{ const d=deltas[k]; const c=d>0?'up':d<0?'down':'zero'; return `<span class="chip ${c}">${d>0?'+':''}${d} ${STATS[k].label}</span>`; }).join('');
}

function render(){
  const app = $('#app');
  if(DB.setup){ return renderSetup(app); }
  if(!DB.game || DB.view==='home'){ return renderHome(app); }
  const g = DB.game, step = g.steps[g.pos];
  if(step.k==='stage') return renderStage(app, g, step);
  if(step.k==='scene') return renderScene(app, g, step);
  if(step.k==='reflect') return renderReflect(app, g, step);
  if(step.k==='end') return renderEnd(app, g);
}

    <br><button class="danger" id="wipe" type="button" style="margin-top:.6rem">🗑 Borrar mis datos de este dispositivo</button></p>
  </section>`;
  const keep = ()=>{ DB.student=$('#student').value.trim(); DB.curso=$('#curso').value.trim(); persist(); };
  $('#student').oninput = keep; $('#curso').oninput = keep;
  const needId = ()=>{ keep(); if(!DB.student){ $('#status').textContent='Escribí tu nombre o código antes de empezar.'; $('#student').focus(); return false; } return true; };
  if($('#resume')) $('#resume').onclick = ()=>{ if(needId()) render(); };
  $('#start').onclick = ()=>{
    if(!needId()) return;
    if(inGame && !confirm(`Si empezás otra vida, se pierde la vida de ${DB.game.char} que no terminaste. ¿Seguir?`)) return;
    DB.game = null; DB.setup = {char:'', g:'', interest:'', strength:''}; persist(); render();
  };
  if($('#dl')) $('#dl').onclick = ()=>{ if(needId()) downloadAll(); };
  $('#wipe').onclick = ()=>{
    if(!confirm('Se borran todas tus vidas y respuestas de este dispositivo. ¿Ya descargaste tu archivo?')) return;
    DB = blank(); try{ localStorage.removeItem(KEY); }catch(e){} render();
  };
}

function renderSetup(app){
  const s = DB.setup;
  const pickGrid = (obj, field, fmt) => `<div class="grid" role="group">${Object.keys(obj).map(k=>`<button type="button" class="pick" data-f="${field}" data-v="${k}" aria-pressed="${s[field]===k}">${fmt(obj[k])}</button>`).join('')}</div>`;
  const ready = s.char.trim() && s.g && s.interest && s.strength;
  app.innerHTML = `<section class="card">
    <p class="eyebrow">Paso previo</p>
    <h1>Creá tu personaje</h1>
    <p class="lead">Es un personaje inventado. Puede parecerse a vos o no: vos decidís.</p>
    <label class="field">Nombre del personaje<input id="char" maxlength="24" placeholder="Ej: Mica, Santi, Rocío…" value="${esc(s.char)}"></label>
    <h2>¿Cómo querés que el juego le nombre?</h2>
    ${pickGrid(GENDERS,'g',l=>`<span>${l}</span>`)}
    <h2>¿Qué le interesa?</h2>
    ${pickGrid(INTERESTS,'interest',x=>`<span class="e">${x.e}</span>${x.label}`)}
    <h2>¿Cuál es su fortaleza?</h2>
    <p class="small" style="margin-top:-.3rem">Le da un empujón de +10 en uno de los indicadores al empezar.</p>
    ${pickGrid(STRENGTHS,'strength',x=>`<b>${x.label}</b><small>${x.desc}</small><small>${STATS[x.stat].icon} +10 ${STATS[x.stat].label}</small>`)}
    <div class="actions"><button class="primary" id="go" type="button" ${ready?'':'disabled'}>Arrancar a los 15 →</button><button class="secondary" id="back" type="button">Volver</button></div>
  </section>`;
  $('#char').oninput = e=>{ s.char=e.target.value; persist(); $('#go').disabled = !(s.char.trim() && s.g && s.interest && s.strength); };
  app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ s[b.dataset.f]=b.dataset.v; s.char=$('#char').value; persist(); renderSetup(app); });
  $('#go').onclick = ()=>{ s.char=s.char.trim(); newGame(s); render(); window.scrollTo({top:0}); };
  $('#back').onclick = ()=>{ DB.setup=null; persist(); render(); };
}

function renderStage(app, g, step){
  const st = STAGES[step.i];
  app.innerHTML = hud(g) + `<section class="card" style="text-align:center">
    <p class="eyebrow">Etapa ${step.i+1} de ${STAGES.length}</p>
    <div class="big-emoji">${st.e}</div>
    <h1>${esc(st.name)} · ${st.age} años</h1>
    <p class="lead">${esc(st.intro)}</p>
    <div class="actions" style="justify-content:center"><button class="primary" id="next" type="button">Empezar etapa →</button></div>
  </section>`;
  $('#next').onclick = next;
}

function renderScene(app, g, step){
  const sc = SCENES[step.id], st = STAGES[stageOfStep(g, g.pos)];
  const echo = sc.echo ? val(sc.echo, g) : null;
  const letters = 'ABCD';
  let body;
  if(!g.picked){
    body = `<div class="options">${sc.options.map((op,i)=>{
      const locked = op.need && !op.need(g);
      return `<button type="button" class="opt" data-i="${i}" ${locked?'disabled':''}><span class="l">${letters[i]}</span><span>${esc(val(op.t,g))}${locked?`<span class="lock">🔒 ${esc(op.lock)}</span>`:''}</span></button>`;
    }).join('')}</div>`;
  } else {
    const op = sc.options[g.picked.idx];
    body = `<div class="chosen"><span class="tag">Tu decisión</span><p style="margin:.3rem 0 0">${esc(val(op.t,g))}</p></div>
      <div class="result"><h2>Qué pasó</h2><p>${esc(g.picked.fb)}</p>
      <div class="chips">${chipsHTML(g.picked.deltas)}</div>
      <div class="actions"><button class="primary" id="next" type="button">Seguir →</button></div></div>`;
  }
  app.innerHTML = hud(g) + `<section class="card">
    <p class="eyebrow">${esc(st.name)} · ${st.age} años</p>
    <div class="big-emoji">${sc.e}</div>
    <h1>${esc(sc.title)}</h1>
    <p class="lead">${esc(val(sc.text,g))}</p>
    ${echo?`<div class="echo"><span>🔁</span><div><b>Viene de antes</b>${esc(echo)}</div></div>`:''}
    ${sc.care?`<div class="care">Si algo así te pasa de verdad a vos o a alguien que conocés, hablá con tu tutor/a u otro adulto de la escuela.</div>`:''}
    ${body}
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  if($('#next')) $('#next').onclick = next;
}

function renderReflect(app, g, step){
  const st = STAGES[step.i];
  const last = step.i === STAGES.length-1;
  app.innerHTML = hud(g) + `<section class="card">
    <p class="eyebrow">${last?'Antes del final':'Pausa para pensar'} · ${esc(st.name)}</p>
    <div class="big-emoji">${last?'💌':'✍️'}</div>
    <h1>${last?'Un consejo para alguien de 15':'¿Qué viste en esta etapa?'}</h1>
    <label class="field">${esc(st.reflect)}<textarea id="ref" placeholder="Escribí con tus palabras…">${esc(g.draft)}</textarea></label>
    <p class="counter" id="cnt"></p>
    <div class="actions"><button class="primary" id="save" type="button">Guardar y seguir →</button></div>
  </section>`;
  const ta=$('#ref'), cnt=$('#cnt'), btn=$('#save');
  const upd = ()=>{ const n=ta.value.trim().length; cnt.textContent = n>=MIN_REFLECT?'✓ Listo':`Escribí al menos ${MIN_REFLECT} caracteres (llevás ${n})`; cnt.className='counter'+(n>=MIN_REFLECT?' ok':''); btn.disabled = n<MIN_REFLECT; };
  ta.oninput = ()=>{ g.draft=ta.value; persist(); upd(); };
  upd();
  btn.onclick = ()=>{ g.reflections[step.i] = {q:st.reflect, a:ta.value.trim()}; next(); };
}

function renderEnd(app, g){
  if(g.lifeIndex===null){
    g.ending = computeEnding(g);
    g.finished = new Date().toISOString();
    g.final = {a:'', b:''};
    DB.lives.push(JSON.parse(JSON.stringify(g)));
    g.lifeIndex = DB.lives.length-1;
    persist();
  }
  const life = DB.lives[g.lifeIndex], e = life.ending;
  const many = DB.lives.length > 1;
  const moments = life.log.filter(l=>l.memo).map(l=>`<li>${esc(l.memo)}</li>`).join('');
  app.innerHTML = `<section class="card">
    <div class="ending"><p class="eyebrow">Vida ${g.lifeIndex+1} · ${esc(life.char)} a los 22 años</p><div class="big-emoji">${e.emoji}</div><h1>${esc(e.title)}</h1></div>
    <p class="lead">${esc(e.text)}</p>
    ${e.weak?`<p>${esc(e.weak)}</p>`:''}
    <div class="note">No hay una vida «correcta». Cada camino tuvo costos y beneficios. Lo importante es darte cuenta de qué decisiones pesaron más.</div>
    <div class="bars" style="margin:1rem 0">${barsHTML(life.stats)}</div>
    ${moments?`<h2>Momentos que marcaron esta vida</h2><ul class="moments">${moments}</ul>`:''}
    <h2>Para cerrar</h2>
    <label class="field">¿Con qué decisión de tu personaje estás más de acuerdo y con cuál no? ¿Por qué?<textarea id="fa">${esc(life.final.a)}</textarea></label>
    ${many?`<label class="field">Ya viviste más de una vida. ¿Qué hiciste distinto esta vez y qué cambió en el resultado?<textarea id="fb">${esc(life.final.b)}</textarea></label>`:''}
    <p class="counter" id="cnt"></p>
    <div class="actions">
      <button class="primary" id="dl" type="button">⬇ Descargar mi trabajo</button>
      <button class="secondary" id="again" type="button">🔄 Vivir otra vida</button>
    </div>
    <p class="status" id="status"></p>
    <p class="small">El archivo incluye todas las vidas que terminaste (${DB.lives.length}). Subilo a la tarea de Classroom.</p>
  </section>`;
  const fa=$('#fa'), fbx=$('#fb'), cnt=$('#cnt');
  const ok = ()=> fa.value.trim().length>=MIN_REFLECT && (!fbx || fbx.value.trim().length>=MIN_REFLECT);
  const upd = ()=>{ cnt.textContent = ok()?'✓ Listo para descargar':`Completá ${fbx?'las preguntas':'la pregunta'} de cierre (mínimo ${MIN_REFLECT} caracteres cada una).`; cnt.className='counter'+(ok()?' ok':''); };
  const keep = ()=>{ life.final.a=fa.value.trim(); if(fbx) life.final.b=fbx.value.trim(); persist(); upd(); };
  fa.oninput = keep; if(fbx) fbx.oninput = keep; upd();
  $('#dl').onclick = ()=>{
    if(!ok()){ $('#status').textContent='Antes de descargar, completá el cierre.'; fa.focus(); return; }
    keep(); downloadAll(); $('#status').textContent='Archivo descargado. Subilo a la tarea de Classroom.';
  };
  $('#again').onclick = ()=>{
    if(!ok() && !confirm('Todavía no completaste el cierre de esta vida y después no vas a poder volver a esta pantalla. ¿Seguir igual?')) return;
    keep(); DB.game=null; DB.setup={char:'', g:'', interest:'', strength:''}; persist(); render(); window.scrollTo({top:0});
  };
}

/* ---------------- DESCARGA ---------------- */
function safeName(){ return (DB.student||'alumno').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,40); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}); }catch(e){ return iso; } }
function deltasText(d){ const k=Object.keys(d); return k.length? k.map(x=>`${d[x]>0?'+':''}${d[x]} ${STATS[x].label}`).join(', ') : 'sin cambios'; }
function lifeText(l, i){
  const L = [];
  L.push('═'.repeat(60));
  L.push(`VIDA ${i+1} — Personaje: ${l.char}`);
  L.push(`Interés: ${INTERESTS[l.interest].label} · Fortaleza: ${STRENGTHS[l.strength].label}`);
  L.push(`Terminada: ${fmtDate(l.finished)}`);
  L.push(`FINAL: ${l.ending.title} — ${l.ending.text}${l.ending.weak?' '+l.ending.weak:''}`);
  L.push('Indicadores a los 22: ' + Object.keys(STATS).map(k=>`${STATS[k].label} ${l.stats[k]}/100`).join(' · '));
  L.push('═'.repeat(60), '', '--- DECISIONES ---', '');
  l.log.forEach((x,j)=>{
    L.push(`${j+1}. [${x.stage}] ${x.title}`);
    if(x.echo) L.push(`   (Viene de antes: ${x.echo})`);
    L.push(`   Eligió: ${x.choice}`);
    L.push(`   Qué pasó: ${x.fb}`);
    L.push(`   Cambios: ${deltasText(x.deltas)}`, '');
  });
  L.push('--- REFLEXIONES ---', '');
  l.reflections.forEach((r,j)=>{ if(r){ L.push(`Etapa ${j+1}: ${r.q}`, `→ ${r.a}`, ''); } });
  L.push('--- CIERRE ---', '');
  L.push('¿Con qué decisión estás más de acuerdo y con cuál no? ¿Por qué?', `→ ${l.final.a||'(sin respuesta)'}`, '');
  if(i>0) L.push('¿Qué hiciste distinto esta vez y qué cambió?', `→ ${l.final.b||'(sin respuesta)'}`, '');
  return L.join('\n');
}
function downloadAll(){
  const head = [
    'SIMULADOR DE VIDA — Tutoría 3° año',
    `Alumno/a (nombre o código): ${DB.student||'(sin completar)'}`,
    `Curso: ${DB.curso||'(sin completar)'}`,
    `Descargado: ${fmtDate(new Date().toISOString())}`,
    `Vidas terminadas: ${DB.lives.length}`,
    ''
  ].join('\n');
  const body = DB.lives.map(lifeText).join('\n\n');
  const blob = new Blob([head+'\n'+body], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `Simulador-vida-${safeName()}.txt`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

$('#homeBtn').onclick = ()=>{ DB.setup=null; DB.view='home'; render(); window.scrollTo({top:0}); };
render();
</script>
